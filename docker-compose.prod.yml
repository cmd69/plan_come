services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plancome
    ports:
      - "${APP_PORT:-3041}:3000"
    volumes:
      - plancome_data:/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/plancome.db}
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  plancome_data:
