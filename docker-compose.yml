services:
  app:
    image: cmd69/plan-come:latest
    container_name: plancome
    ports:
      - "${APP_PORT:-3041}:3000"
    volumes:
      - plancome-data:/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/plancome.db}
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - AUTH_SECRET=${AUTH_SECRET:-cambiar-este-secreto-en-produccion}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  plancome-data:
