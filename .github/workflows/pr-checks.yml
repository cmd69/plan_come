# =============================================================================
# PR checks: Lint, Build (con dependencias)
# =============================================================================
# Solo en PR contra main. Orden:
#   1. Lint (rápido; si falla no se ejecuta el build)
#   2. Build imagen Docker de producción (solo si lint pasó)
# =============================================================================
name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: plancome:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
