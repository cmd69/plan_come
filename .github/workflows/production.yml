# =============================================================================
# Production: Build, push a Docker Hub y deploy en el servidor
# =============================================================================
# Solo al hacer push (merge) a main. En las PRs ya corre "PR checks"
# (Lint + Build); para que un fallo bloquee el merge, protege la rama
# y exige que pasen esos checks.
# =============================================================================
name: Production

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE: cmd69/plan-come

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          VERSION="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="$HOME/${{ secrets.PROD_PATH }}"
            cd "$DEPLOY_DIR" || { echo "Deploy dir not found: $DEPLOY_DIR"; exit 1; }
            git pull || true
            echo "🔄 Backup de BD antes del deploy..."
            make backup || { echo "⚠️ Backup falló. Continuando deploy..."; }
            make deploy
