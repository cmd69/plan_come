services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: plancome-dev
    ports:
      - "${APP_PORT:-3040}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./data:/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/plancome.db}
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - AUTH_SECRET=${AUTH_SECRET:-cambiar-este-secreto-en-produccion}
    restart: "no"
