services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: plancome_app_dev
    ports:
      - "${APP_PORT:-3040}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - plancome_data_dev:/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/plancome.db}
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
    restart: "no"

volumes:
  plancome_data_dev:
